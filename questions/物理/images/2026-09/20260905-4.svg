<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="800" height="480" fill="#ffffff"/>
  <text x="400" y="45" font-size="20" font-weight="bold" text-anchor="middle" fill="#212121">③ 开关断开，电压表接开关两端 → 有示数 ≈ 电源电压</text>
  <!-- 等电势色带（画在导线下面） -->
  <path d="M120,100 H680 V320 H520" stroke="#1565c0" stroke-opacity="0.15" stroke-width="16" fill="none"/>
  <path d="M600,320 H120 V206" stroke="#c62828" stroke-opacity="0.15" stroke-width="16" fill="none"/>
  <!-- 导线 -->
  <g stroke="#212121" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M120,100 H374"/>
    <path d="M120,100 V186"/>
    <path d="M120,206 V320 H520"/>
    <path d="M426,100 H680 V320 H600"/>
  </g>
  <!-- 电源符号 -->
  <line x1="96" y1="186" x2="144" y2="186" stroke="#212121" stroke-width="3"/>
  <line x1="108" y1="206" x2="132" y2="206" stroke="#212121" stroke-width="8"/>
  <text x="152" y="192" font-size="22" font-weight="bold" fill="#1565c0">+</text>
  <text x="152" y="224" font-size="22" font-weight="bold" fill="#c62828">−</text>
  <text x="66" y="205" font-size="15" text-anchor="middle" fill="#555555">电源</text>
  <!-- 灯泡（熄灭） -->
  <circle cx="400" cy="100" r="26" fill="#ffffff" stroke="#9e9e9e" stroke-width="3"/>
  <path d="M381,81 L419,119 M419,81 L381,119" stroke="#9e9e9e" stroke-width="3" fill="none"/>
  <!-- 开关（断开） -->
  <circle cx="520" cy="320" r="4.5" fill="#212121"/>
  <circle cx="600" cy="320" r="4.5" fill="#212121"/>
  <path d="M520,320 L558,272" stroke="#212121" stroke-width="3" stroke-linecap="round"/>
  <text x="572" y="256" font-size="16" font-weight="bold" text-anchor="middle" fill="#c62828">断点！</text>
  <!-- 节点 -->
  <circle cx="300" cy="100" r="4.5" fill="#212121"/>
  <circle cx="490" cy="100" r="4.5" fill="#212121"/>
  <text x="300" y="72" font-size="17" font-weight="bold" text-anchor="middle" fill="#212121">A</text>
  <text x="400" y="72" font-size="15" text-anchor="middle" fill="#555555">灯泡（不亮）</text>
  <text x="490" y="72" font-size="17" font-weight="bold" text-anchor="middle" fill="#212121">B</text>
  <text x="488" y="352" font-size="17" font-weight="bold" text-anchor="middle" fill="#212121">C</text>
  <text x="632" y="352" font-size="17" font-weight="bold" text-anchor="middle" fill="#212121">D</text>
  <!-- 电压表并联在开关两端 -->
  <g stroke="#212121" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M520,320 V408 H526"/>
    <path d="M594,408 H600 V320"/>
  </g>
  <circle cx="560" cy="408" r="34" fill="#ffffff" stroke="#212121" stroke-width="3"/>
  <text x="560" y="418" font-size="30" font-weight="bold" text-anchor="middle" fill="#212121">V</text>
  <!-- 极小电流方向（绿色） -->
  <polygon points="242,93 260,100 242,107" fill="#2e7d32"/>
  <polygon points="673,197 687,197 680,215" fill="#2e7d32"/>
  <polygon points="513,360 527,360 520,376" fill="#2e7d32"/>
  <polygon points="593,376 607,376 600,360" fill="#2e7d32"/>
  <polygon points="308,313 290,320 308,327" fill="#2e7d32"/>
  <text x="420" y="140" font-size="15" text-anchor="middle" fill="#2e7d32">极小电流 I（灯不亮）</text>
  <!-- 电势标注 -->
  <text x="230" y="135" font-size="15" font-weight="bold" text-anchor="middle" fill="#1565c0">正极电势</text>
  <text x="300" y="296" font-size="15" font-weight="bold" text-anchor="middle" fill="#c62828">负极电势</text>
  <text x="400" y="225" font-size="16" text-anchor="middle" fill="#1565c0">电压表「桥」住断点，与电源构成回路</text>
  <!-- 底部结论 -->
  <text x="300" y="392" font-size="15" text-anchor="middle" fill="#424242">R_V ≫ R灯 → 电压几乎全降在电压表上</text>
  <text x="300" y="420" font-size="15" text-anchor="middle" fill="#424242">C 点 = 正极电势，D 点 = 负极电势</text>
  <text x="300" y="450" font-size="18" font-weight="bold" text-anchor="middle" fill="#c62828">U_CD ≈ 电源电压 → 有示数 ✔</text>
</svg>
